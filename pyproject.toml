[build-system]
requires = ["hatchling>=1.5.0"]
build-backend = "hatchling.build"

[project]
name = "personal-certificate-authority"
version = "0.1.0"
description = "A personal certificate authority for local TLS, for use by Fileglancer and other local apps"
readme = "README.md"
authors = [
    { name = "Mark Kittisopikul", email = "kittisopikulm@janelia.hhmi.org" }
]
license = { file = "LICENSE" }
requires-python = ">=3.12.0"
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click >=8.0,<9",
    "cryptography >=48.0.0,<49",
    "fastapi >=0.136.3,<0.137",
    "jinja2 >=3.1,<4",
    "loguru >=0.7.3,<0.8",
    "pydantic >=2.10.6,<3",
    "pydantic-settings >=2.11.0,<3",
    "uvicorn >=0.38.0,<0.39",
]

[project.scripts]
pca = "personal_certificate_authority.cli:cli"

[project.optional-dependencies]
test = [
    "httpx >=0.28.1,<0.29",
    "pytest >=8.4.2,<9",
    "pytest-cov >=7.0.0,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["personal_certificate_authority"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
python = ">=3.12.0"
pip = ">=25.0.1,<26"
mkcert = ">=1.4.4,<2"
click = ">=8.0,<9"
cryptography = ">=48.0.0,<49"
fastapi = ">=0.136.3,<0.137"
jinja2 = ">=3.1,<4"
loguru = ">=0.7.3,<0.8"
pydantic = ">=2.10.6,<3"
pydantic-settings = ">=2.11.0,<3"
uvicorn = ">=0.38.0,<0.39"

[tool.pixi.pypi-dependencies]
personal-certificate-authority = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
httpx = ">=0.28.1,<0.29"
pytest = ">=8.4.2,<9"
pytest-cov = ">=7.0.0,<8"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
pip-install = { cmd = "pixi reinstall personal-certificate-authority" }
init = "pca init"
issue = "pca issue"
serve = "pca serve"
status = "pca status"

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest --cov=personal_certificate_authority --cov-report=term", default-environment = "test" }
